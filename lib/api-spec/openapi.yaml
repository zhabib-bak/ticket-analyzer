openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ticket Analyzer AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Ticket and upload management
  - name: ai
    description: AI-powered analysis endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tickets/uploads:
    get:
      operationId: listUploads
      tags: [tickets]
      summary: List all CSV uploads
      responses:
        "200":
          description: List of uploads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"

  /tickets/uploads/{id}:
    delete:
      operationId: deleteUpload
      tags: [tickets]
      summary: Delete an upload and its tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /tickets/dashboard:
    get:
      operationId: getDashboard
      tags: [tickets]
      summary: Get dashboard statistics
      parameters:
        - name: upload_id
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /tickets/list:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets with optional filters
      parameters:
        - name: upload_id
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: category
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: priority
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: assignee
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI about tickets (with conversation memory)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /ai/analyze/{uploadId}:
    post:
      operationId: analyzeUpload
      tags: [ai]
      summary: Auto-analyze a CSV upload and generate AI insights
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /ai/report/{uploadId}:
    get:
      operationId: getReport
      tags: [ai]
      summary: Generate an exportable Markdown report
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

  /ai/anomalies:
    get:
      operationId: detectAnomalies
      tags: [ai]
      summary: Detect anomalies and unusual patterns in tickets
      parameters:
        - name: upload_id
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Anomaly detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyResult"

  /ai/categorize/{uploadId}:
    post:
      operationId: categorizeTickets
      tags: [ai]
      summary: Auto-categorize uncategorized tickets using AI
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Categorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationResult"

  /ai/conversations:
    get:
      operationId: listConversations
      tags: [ai]
      summary: List recent AI conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    Upload:
      type: object
      required: [id, filename, row_count, uploaded_at]
      properties:
        id:
          type: integer
        filename:
          type: string
        row_count:
          type: integer
        week_label:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        uploaded_at:
          type: string
        ai_summary:
          type: ["string", "null"]
        anomaly_count:
          type: ["integer", "null"]

    Ticket:
      type: object
      required: [id, upload_id]
      properties:
        id:
          type: integer
        upload_id:
          type: integer
        ticket_id:
          type: ["string", "null"]
        ticket_date:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        assignee:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]
        ai_category:
          type: ["string", "null"]
        is_anomaly:
          type: ["boolean", "null"]

    ChartDataPoint:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: integer

    DashboardData:
      type: object
      required: [total, byCategory, byPriority, byStatus, byAssignee, byWeek]
      properties:
        total:
          type: integer
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        byPriority:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        byAssignee:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        byWeek:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        openP1Count:
          type: integer
        avgResolutionDays:
          type: ["number", "null"]

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string
        timestamp:
          type: ["string", "null"]

    ChatInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
        upload_id:
          type: ["integer", "null"]
        conversation_id:
          type: ["string", "null"]

    ChatResponse:
      type: object
      required: [answer, conversation_id]
      properties:
        answer:
          type: string
        conversation_id:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    AnalysisResult:
      type: object
      required: [summary, key_findings, recommendations]
      properties:
        summary:
          type: string
        key_findings:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        top_categories:
          type: array
          items:
            type: string
        risk_level:
          type: string
        anomalies_detected:
          type: integer

    ReportResult:
      type: object
      required: [markdown, generated_at]
      properties:
        markdown:
          type: string
        generated_at:
          type: string

    AnomalyItem:
      type: object
      required: [type, description, severity]
      properties:
        type:
          type: string
        description:
          type: string
        severity:
          type: string
        affected_tickets:
          type: ["integer", "null"]
        affected_category:
          type: ["string", "null"]

    AnomalyResult:
      type: object
      required: [anomalies, summary]
      properties:
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyItem"
        summary:
          type: string
        risk_score:
          type: integer

    CategorySuggestion:
      type: object
      required: [ticket_id, suggested_category, confidence]
      properties:
        ticket_id:
          type: integer
        suggested_category:
          type: string
        confidence:
          type: number

    CategorizationResult:
      type: object
      required: [suggestions, applied]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/CategorySuggestion"
        applied:
          type: integer

    Conversation:
      type: object
      required: [id, created_at, message_count]
      properties:
        id:
          type: string
        created_at:
          type: string
        message_count:
          type: integer
        last_question:
          type: ["string", "null"]
        upload_id:
          type: ["integer", "null"]
